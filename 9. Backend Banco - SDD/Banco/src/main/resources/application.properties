spring.application.name=Banco

# NOTA: Los archivos SQL del esquema usan la base "banco_core".
# La aplicacion apunta a "banco_bd". Verifica que ambos nombres coincidan en tu entorno.
# Configura las siguientes variables de entorno antes de ejecutar:
#   DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:banco_bd}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:banco_user}
spring.datasource.password=${DB_PASSWORD:Banco123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:bancoBD-super-secret-key-for-development-only-2024-must-be-at-least-32-chars}
jwt.expiration=${JWT_EXPIRATION:86400}

# CORS
cors.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}

# SpringDoc / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
